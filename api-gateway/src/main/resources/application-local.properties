spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:12312/eureka
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
# Instance Settings
eureka.instance.prefer-ip-address=false
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
# ui-service
spring.cloud.gateway.routes[0].id=static-resources
spring.cloud.gateway.routes[0].uri=lb://ui-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/static/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
# auth-service
spring.cloud.gateway.routes[1].id=auth
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/login, /register, /logout
# account-service
spring.cloud.gateway.routes[2].id=account
spring.cloud.gateway.routes[2].uri=lb://account-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/account/**, /api/account/**
spring.cloud.gateway.routes[2].filters[0]=DedupeResponseHeader=Location
spring.cloud.gateway.routes[2].filters[1]=RewritePath=/api/account/(?<segment>.*), /${segment}
# message-service
spring.cloud.gateway.routes[3].id=message
spring.cloud.gateway.routes[3].uri=lb://message-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/message/**, /message/**, /ws/**
# phone-service
spring.cloud.gateway.routes[4].id=phone
spring.cloud.gateway.routes[4].uri=lb://phone-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/phone/**
# friendship-service
spring.cloud.gateway.routes[5].id=friendship
spring.cloud.gateway.routes[5].uri=lb://friendship-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/friendship/**, /friendship/**, /friends/**
spring.cloud.gateway.routes[5].filters[0]=DedupeResponseHeader=Location
spring.cloud.gateway.routes[5].filters[1]=RewritePath=/api/friendship/(?<segment>.*), /${segment}
# group-service
spring.cloud.gateway.routes[6].id=group
spring.cloud.gateway.routes[6].uri=lb://group-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/group/**, /group/**
spring.cloud.gateway.routes[6].filters[0]=DedupeResponseHeader=Location
spring.cloud.gateway.routes[6].filters[1]=RewritePath=/api/group/(?<segment>.*), /${segment}
# search-service
spring.cloud.gateway.routes[7].id=search
spring.cloud.gateway.routes[7].uri=lb://search-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/search/**, /search/**
# data-processing-service
spring.cloud.gateway.routes[8].id=search
spring.cloud.gateway.routes[8].uri=lb://data-processing-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/xml-update, /xml-download