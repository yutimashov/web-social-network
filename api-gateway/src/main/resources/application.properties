spring.application.name=api-gateway
server.port=8089
eureka.client.service-url.defaultZone=http://localhost:12312/eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# auth-service
spring.cloud.gateway.routes[0].id=login
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/login, /register

# account-service
spring.cloud.gateway.routes[1].id=account
spring.cloud.gateway.routes[1].uri=lb://account-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/account/**

# ui-service
spring.cloud.gateway.routes[2].id=ui
spring.cloud.gateway.routes[2].uri=lb://ui-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/static/**

# message-service
spring.cloud.gateway.routes[3].id=message
spring.cloud.gateway.routes[3].uri=lb://message-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/message/**, /message/**

# phone-service
spring.cloud.gateway.routes[4].id=phone
spring.cloud.gateway.routes[4].uri=lb://phone-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/phone/**

# friendship-service
spring.cloud.gateway.routes[5].id=friendship
spring.cloud.gateway.routes[5].uri=lb://friendship-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/friendship/**, /friendship/**