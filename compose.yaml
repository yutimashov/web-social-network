name: gjj-web-microservices

services:

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend-network
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_WEB_PORT}:15672"
      - "${RABBITMQ_AMQP_PORT}:5672"
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - backend-network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Discovery Service
  eureka-server:
    image: eureka:v0
    hostname: eureka-server
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT}:12312"
    networks:
      - backend-network

  # API Gateway
  api-gateway:
    image: api-gateway:v0
    hostname: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:8089"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:12312/eureka
    depends_on:
      - eureka-server
    networks:
      - backend-network

  # Auth Service
  auth-service:
    image: auth-service:v0
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT}:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:12312/eureka
    depends_on:
      - eureka-server
    networks:
      - backend-network

  # Account Service
  account-service:
    image: account-service:v0
    container_name: account-service
    restart: unless-stopped
    ports:
      - "${ACCOUNT_SERVICE_PORT}:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:12312/eureka
    depends_on:
      - eureka-server
    networks:
      - backend-network

  # Friendship Service
  friendship-service:
    image: friendship-service:v0
    container_name: friendship-service
    restart: unless-stopped
    ports:
      - "${FRIENDSHIP_SERVICE_PORT}:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:12312/eureka
    depends_on:
      - eureka-server
    networks:
      - backend-network

  # Message Service
  message-service:
    image: message-service:v0
    container_name: message-service
    restart: unless-stopped
    ports:
      - "${MESSAGE_SERVICE_PORT}:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:12312/eureka
    depends_on:
      - eureka-server
    networks:
      - backend-network

  # Group Service
  group-service:
    image: group-service:v0
    container_name: group-service
    restart: unless-stopped
    ports:
      - "${GROUP_SERVICE_PORT}:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:12312/eureka
    depends_on:
      - eureka-server
    networks:
      - backend-network

  # Data Processing Service
  data-processing-service:
    image: data-processing-service:v0
    container_name: data-processing-service
    restart: unless-stopped
    ports:
      - "${DATA_PROCESSING_SERVICE_PORT}:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:12312/eureka
    depends_on:
      - eureka-server
    networks:
      - backend-network

  # Phone Service
  phone-service:
    image: phone-service:v0
    container_name: phone-service
    restart: unless-stopped
    ports:
      - "${PHONE_SERVICE_PORT}:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:12312/eureka
    depends_on:
      - eureka-server
    networks:
      - backend-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  backend-network:
    driver: bridge