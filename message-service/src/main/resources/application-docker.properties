logging.level.org.springframework.security=DEBUG
logging.level.com.fasterxml.jackson.databind=DEBUG
logging.level.org.springframework.session=DEBUG
logging.level.org.springframework.data.redis.serializer=TRACE
spring.application.name=message-service
server.port=8080
eureka.client.service-url.defaultZone=http://eureka-server:12312/eureka
# data
spring.datasource.url=jdbc:postgresql://postgres:5432/social_network
spring.datasource.username=postgres
spring.datasource.password=21122012loliwe+
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# web
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.servlet.session.timeout=10m
# redis caching
redis.cache.newsfeed.size=10
redis.cache.newsfeed.key.prefix=feed:
